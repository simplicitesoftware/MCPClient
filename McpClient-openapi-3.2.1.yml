components:
  schemas:
    Error404:
      description: Not found
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 404
    TreeviewData:
      type: object
      properties:
        item:
          description: Object item with lists of linked objects' items
          type: object
    ArrayOfLlmProvider:
      description: List of Providers
      type: array
      items:
        $ref: '#/components/schemas/LlmProvider'
    Error400:
      description: Bad request
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 400
    LlmProvider:
      description: Provider
      type: object
      properties:
        llmMaxToken:
          description: max token
          type: integer
        llmPrvProvider:
          description: Provider
          type: string
          maxLength: 100
          enum:
          - mistral
          - claude
          - openai
          - mammouth
          - Albert
        llmModel:
          description: model
          type: string
          maxLength: 100
          enum:
          - ''
        llmGptOrganizationId:
          description: OpenAI Organization ID
          type: string
          maxLength: 100
        llmPrvCompletionUrl:
          description: Completion endpoint url
          type: string
          maxLength: 100
        llmPrvDataModel:
          description: Specific parameter
          type: string
          maxLength: 4000
        llmPrvDefaultUrl:
          description: Default url
          type: string
          maxLength: 100
        llmGptProjectId:
          description: OpenAI Project ID
          type: string
          maxLength: 100
        llmPrvUserParameters:
          description: Prv user parameters
          type: string
          maxLength: 5000
        llmPrvSttUrl:
          description: Speech to text url
          type: string
          maxLength: 100
        llmPrvModelsUrl:
          description: Models url
          type: string
          maxLength: 100
        llmDataDisclamer:
          description: Data disclamer
          type: boolean
        llmApiKey:
          description: api key
          type: string
          maxLength: 500
        llmAnthropicWorkspaceId:
          description: anthropic workspace id
          type: string
          maxLength: 100
        llmPrvPingUrl:
          description: Ping url
          type: string
          maxLength: 100
        row_id:
          description: Unique technical row ID
          type: string
          maxLength: 11
        llmHistoryDepth:
          description: History depth
          type: integer
        llmPrvHelp:
          description: Key and endpoints help
          type: string
          maxLength: 50000
    Error401:
      description: Unauthorized
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 401
    Error500:
      description: Internal server error
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 500
    Error403:
      description: Forbidden
      type: object
      properties:
        error:
          description: Error message
          type: string
        status:
          description: Error status
          type: integer
          enum:
          - 403
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http
    bearerAuth:
      bearerFormat: Simplicite token
      scheme: bearer
      type: http
servers:
- url: /api
openapi: 3.2.1
paths:
  /login:
    get:
      summary: Login (obtain bearer token)
      security:
      - basicAuth: []
      operationId: login
      responses:
        '200':
          description: Successful login
          content:
            application/json: {}
            text/plain: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
      parameters:
      - schema:
          type: string
          enum:
          - json
          - oauth2
          - token
        in: query
        name: _output
        description: Optional output format
        required: false
      tags:
      - session
  /logout:
    get:
      summary: Logout (revoke bearer token)
      security:
      - bearerAuth: []
      operationId: logout
      responses:
        '200':
          description: Successfull logout
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
      tags:
      - session
  /rest/LlmProvider/{row_id}:
    post:
      summary: Create a new LlmProvider business object record
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProvider'
      operationId: obj-llmprovider-create
      responses:
        '200':
          description: Success in creating a new business object record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
      parameters:
      - schema:
          type: string
        in: path
        name: row_id
        description: Row ID (or empty or _ for all row IDs)
        required: true
      tags:
      - LlmProvider
    get:
      summary: Get a LlmProvider business object record
      security:
      - bearerAuth: []
      operationId: obj-llmprovider-get
      responses:
        '200':
          description: Success in getting a single business object record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
      parameters:
      - schema:
          type: string
        in: path
        name: row_id
        description: Row ID (or empty or _ for all row IDs)
        required: true
      - schema:
          type: boolean
        in: query
        name: _inline_documents
        description: Inline documents?
        required: false
      - schema:
          type: boolean
        in: query
        name: _inline_thumbnails
        description: Inline documents' thumbnails?
        required: false
      - schema:
          type: boolean
        in: query
        name: _inline_objects
        description: Inline objects?
        required: false
      tags:
      - LlmProvider
    delete:
      summary: Delete a LlmProvider business object record
      security:
      - bearerAuth: []
      operationId: obj-llmprovider-delete
      responses:
        '200':
          description: Success in deleting a business object record
          content:
            application/json: {}
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
      parameters:
      - schema:
          type: string
        in: path
        name: row_id
        description: Row ID (or empty or _ for all row IDs)
        required: true
      tags:
      - LlmProvider
    put:
      summary: Update a LlmProvider business object record
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProvider'
      operationId: obj-llmprovider-update
      responses:
        '200':
          description: Success in updating a business object record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
      parameters:
      - schema:
          type: string
        in: path
        name: row_id
        description: Row ID (or empty or _ for all row IDs)
        required: true
      tags:
      - LlmProvider
  /rest/LlmProvider:
    get:
      summary: Search LlmProvider business object records or get contextualized metadata
      security:
      - bearerAuth: []
      operationId: obj-llmprovider-search
      responses:
        '200':
          description: Success in searching business object records (or in getting
            contextualized business object metadata, documentation, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfLlmProvider'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
      parameters:
      - schema:
          type: boolean
        in: query
        name: _metadata
        description: Metadata?
        required: false
      - schema:
          type: boolean
        in: query
        name: _count
        description: Count?
        required: false
      - schema:
          type: boolean
        in: query
        name: _doc
        description: Documentation?
        required: false
      - schema:
          type: string
          enum:
          - mistral
          - claude
          - openai
          - mammouth
          - Albert
        in: query
        name: llmPrvProvider
        description: Search filter for Provider
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvDefaultUrl
        description: Search filter for Default url
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvDataModel
        description: Search filter for Specific parameter
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvHelp
        description: Search filter for Key and endpoints help
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvUserParameters
        description: Search filter for Prv user parameters
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvModelsUrl
        description: Search filter for Models url
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvCompletionUrl
        description: Search filter for Completion endpoint url
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvPingUrl
        description: Search filter for Ping url
        required: false
      - schema:
          type: string
        in: query
        name: llmPrvSttUrl
        description: Search filter for Speech to text url
        required: false
      - schema:
          type: string
          enum:
          - ''
        in: query
        name: llmModel
        description: Search filter for model
        required: false
      - schema:
          type: integer
        in: query
        name: llmHistoryDepth
        description: Search filter for History depth
        required: false
      - schema:
          type: integer
        in: query
        name: llmMaxToken
        description: Search filter for max token
        required: false
      - schema:
          type: boolean
        in: query
        name: llmDataDisclamer
        description: Search filter for Data disclamer
        required: false
      - schema:
          type: string
        in: query
        name: llmApiKey
        description: Search filter for api key
        required: false
      - schema:
          type: string
        in: query
        name: llmAnthropicWorkspaceId
        description: Search filter for anthropic workspace id
        required: false
      - schema:
          type: string
        in: query
        name: llmGptProjectId
        description: Search filter for OpenAI Project ID
        required: false
      - schema:
          type: string
        in: query
        name: llmGptOrganizationId
        description: Search filter for OpenAI Organization ID
        required: false
      tags:
      - LlmProvider
  /:
    get:
      summary: Get user session information
      security:
      - bearerAuth: []
      operationId: info
      responses:
        '200':
          description: Success in getting user session information
          content:
            application/json: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
      parameters:
      - schema:
          type: boolean
        in: query
        name: texts
        description: Texts?
        required: false
      tags:
      - session
info:
  license:
    name: Simplicite license
    url: http://www.simplicitesoftware.com
  contact:
    name: Simplicite Software
    url: http://www.simplicitesoftware.com
    email: contact@simplicitesoftware.com
  description: API for module McpClient
  title: McpClient
  version: '7'
tags:
- name: LlmProvider
  description: Provider
